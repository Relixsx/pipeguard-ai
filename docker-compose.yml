# ─────────────────────────────────────────────────────────────────
#  PipeGuard AI — Docker Compose
#  Development:  docker-compose up
#  Production:   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
# ─────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── FastAPI Backend ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipeguard_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models    # persist trained model
      - ./data:/app/data        # persist SQLite DB + CSV
      - ./logs:/app/logs        # persist log files
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 60s

  # ── Nginx — serves frontend + reverse proxies API ─────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: pipeguard_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pipeguard_data:
  pipeguard_logs:
